{% extends 'base.html' %}
{% block title %}Вход · Учебный портал{% endblock %}
{% block content %}
<section class="login-layout">
  <div class="card login-card">
    <div class="card-body">
      <div class="login-mark"><i data-lucide="graduation-cap"></i></div>
      <h1 class="h2 text-center mb-4">Вход в учебный портал</h1>
      <form method="post">{% csrf_token %}
        {% if form.errors %}<div class="alert alert-danger" role="alert">Проверьте логин и пароль.</div>{% endif %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="mb-3"><label class="form-label" for="id_username">Логин</label><input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required value="{{ form.username.value|default:'' }}"></div>
        <div class="mb-4"><label class="form-label" for="id_password">Пароль</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
        <button class="btn btn-primary w-100" type="submit"><i data-lucide="log-in"></i> Войти</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
